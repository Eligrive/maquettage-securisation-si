stages:
  - lint_and_validate
  - plan
  - apply
  - provision

# Les fichiers .tf sont dans le sous-dossier terraform/ : on s'y place avant
# chaque job (sinon terraform tourne à la racine et ne voit aucune config).
variables:
  TF_ROOT: "${CI_PROJECT_DIR}/terraform"
  # Nom du state dans le backend Terraform managé par GitLab
  TF_STATE_NAME: "default"
  TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"

default:
  before_script:
    - cd "${TF_ROOT}"

# Init avec le backend HTTP du state managé GitLab (auth via CI_JOB_TOKEN).
# NB : terraform plan/apply nécessitent en plus les credentials OpenStack
#      (application credential "gitlab-ci-unicampus") en variables CI/CD :
#        - OS_AUTH_URL
#        - OS_AUTH_TYPE=v3applicationcredential
#        - OS_APPLICATION_CREDENTIAL_ID      (masked, protected)
#        - OS_APPLICATION_CREDENTIAL_SECRET  (masked, protected)
#        - OS_REGION_NAME
#        - OS_INTERFACE=public
#      Et la clé SSH injectée dans les VMs :
#        - TF_VAR_ssh_public_key
.tf_init_backend: &tf_init_backend >-
  terraform init
  -backend-config="address=${TF_ADDRESS}"
  -backend-config="lock_address=${TF_ADDRESS}/lock"
  -backend-config="unlock_address=${TF_ADDRESS}/lock"
  -backend-config="username=gitlab-ci-token"
  -backend-config="password=${CI_JOB_TOKEN}"
  -backend-config="lock_method=POST"
  -backend-config="unlock_method=DELETE"
  -backend-config="retry_wait_min=5"

# ---------------------------------------------------------
# STAGE 1 : S'exécute sur TOUTES les branches (feat, develop, main)
# ---------------------------------------------------------
# Ce job ne crée rien. Il vérifie juste que votre code est 
# syntaxiquement correct et bien indenté.
terraform_check:
  stage: lint_and_validate
  image:
    name: hashicorp/terraform:latest # (Rappel: préférez une version fixe comme 1.6.0)
    entrypoint: [""]
  script:
    # -backend=false permet d'initier sans se connecter à OpenStack
    - terraform init -backend=false
    - terraform fmt -check
    - terraform validate

# ---------------------------------------------------------
# STAGE 2 : Le brouillon (Ne crée rien non plus)
# ---------------------------------------------------------
# Ce job va lire OpenStack et vous dire ce qu'il COMPTE faire, 
# sans le faire. Utile quand vous ouvrez une Merge Request.
terraform_plan:
  stage: plan
  image:
    name: hashicorp/terraform:latest # (Rappel: préférez une version fixe comme 1.6.0)
    entrypoint: [""]
  script:
    - *tf_init_backend
    - terraform plan
  rules:
    # S'exécute uniquement sur develop, main, ou lors d'une Merge Request
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_IID'

# ---------------------------------------------------------
# STAGE 3 : La création réelle (Strictement MANUEL)
# ---------------------------------------------------------
# Ce job est bloqué. Il apparaîtra dans GitLab avec une icône "Play" (▶️).
# Il attendra indéfiniment que vous cliquiez dessus.
terraform_apply:
  stage: apply
  image:
    name: hashicorp/terraform:latest # (Rappel: préférez une version fixe comme 1.6.0)
    entrypoint: [""]
  script:
    - *tf_init_backend
    # -parallelism=6 : compromis entre la valeur défaut (10, qui burst trop
    # le scheduler Nova sur la zone cisco) et 2 (trop lent, ~6 min).
    # Si "No valid host was found" reapparait, redescendre à 2 ou 3.
    - terraform apply -auto-approve -parallelism=6
  rules:
    # N'apparaît QUE sur develop et main, et nécessite un clic humain
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      when: manual

# ---------------------------------------------------------
# LINT Ansible : vérifie la syntaxe des playbooks/rôles du lot Supervision.
# Ne se connecte à rien (pas d'OpenStack, pas de SSH). Tourne sur toutes les
# branches comme le terraform_check.
# ---------------------------------------------------------
ansible_syntax:
  stage: lint_and_validate
  image: alpine:3.20
  # On surcharge le before_script global (qui fait `cd terraform/`).
  before_script:
    - apk add --no-cache ansible
  script:
    - cd "${CI_PROJECT_DIR}/ansible"
    - ansible-playbook --syntax-check -i inventory/hosts.ini site.yml

# ---------------------------------------------------------
# PROVISION Ansible : déploie TOUTE la maquette APRÈS le terraform_apply via
# site.yml = provision.yml (base v1 : pare-feu, services, comptes, leurres,
# postes) PUIS supervision.yml (SIEM Wazuh + Suricata). Strictement MANUEL.
#
# Topologie V2 SEGMENTÉE : inventory/hosts.ini, rebond SSH via la Floating IP du
# firewall central (gateway de tous les VLAN). Le firewall est provisionné EN
# PREMIER (forwarding/NAT) pour que les autres VMs aient accès Internet.
#
# Variables CI/CD requises (en plus de celles d'OpenStack du terraform_apply) :
#   - ANSIBLE_SSH_PRIVATE_KEY_B64 : clé privée SSH (correspondant à
#       TF_VAR_ssh_public_key) encodée en base64, masquée.
#       Génération :  base64 -w0 ~/.ssh/id_ed25519
#   - SSH_JUMP_HOST (optionnel) : rebond pour atteindre les VMs sans Floating IP.
#       Par défaut dérivé de l'output Terraform firewall_floating_ip
#       (ubuntu@<FIP_firewall>). Surcharger si besoin (ex. bastion).
# ---------------------------------------------------------
ansible_provision:
  stage: provision
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  needs:
    - terraform_apply
  before_script:
    - apk add --no-cache ansible openssh-client bash coreutils
  script:
    # 1. Récupérer les outputs Terraform (Floating IPs) via le state GitLab
    - cd "${TF_ROOT}"
    - *tf_init_backend
    - export MOODLE_FIP="$(terraform output -raw moodle_floating_ip)"
    - export FW_FIP="$(terraform output -raw firewall_floating_ip)"
    # 2. Préparer la clé SSH (jump + cibles) et désactiver le host-key checking
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$ANSIBLE_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ansible
    - chmod 600 ~/.ssh/id_ansible
    - printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_ansible
    # 3. Générer l'inventaire segmenté avec la vraie Floating IP du SIEM
    - cd "${CI_PROJECT_DIR}"
    - TF_DIR="${TF_ROOT}" bash ansible/scripts/gen-inventory.sh ansible/inventory/hosts.ini ansible/inventory/hosts.generated.ini
    # 4. Déployer la maquette complète (rebond = firewall ; wwwroot = FIP moodle)
    - cd ansible
    - JUMP="${SSH_JUMP_HOST:-ubuntu@${FW_FIP}}"
    - ansible-playbook -i inventory/hosts.generated.ini site.yml
      -e "ssh_jump_host=${JUMP}"
      -e "moodle_wwwroot=http://${MOODLE_FIP}"
      --private-key ~/.ssh/id_ansible
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      when: manual