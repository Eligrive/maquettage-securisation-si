---
# ============================================================================
#  Playbook maître — lot Supervision (SIEM Wazuh + IDS/IPS Suricata)
# ============================================================================
#
# Ordre voulu :
#   1. Déployer le manager (le SIEM doit écouter avant l'enrôlement des agents).
#   2. Installer la sonde Suricata sur le firewall central.
#   3. Installer/enrôler les agents Wazuh partout (le firewall, membre du
#      groupe [agents], reçoit aussi son agent qui lit l'eve.json de Suricata).
#
# Exécution :
#   cd ansible/
#   ansible-playbook site.yml                 # topologie segmentée (hosts.ini)
#   ansible-playbook -i inventory/hosts.flat.ini site.yml   # topologie flat
#
# Tags : --tags siem | ids | agents pour ne jouer qu'une partie.

- name: Attendre que toutes les VMs soient joignables en SSH
  hosts: all
  gather_facts: false
  tasks:
    - name: Attendre la connexion SSH (VMs fraîchement déployées / cloud-init)
      ansible.builtin.wait_for_connection:
        timeout: 600
      tags: [always]

- name: SIEM — Wazuh all-in-one (manager + indexer + dashboard)
  hosts: siem
  gather_facts: true
  roles:
    - role: wazuh_manager
      tags: [siem, manager]

- name: IDS/IPS — sonde Suricata sur le firewall central
  hosts: firewall
  gather_facts: true
  roles:
    - role: suricata_ids
      tags: [ids, suricata]

- name: Agents — Wazuh HIDS + collecte de logs sur tous les hôtes supervisés
  hosts: agents
  gather_facts: true
  roles:
    - role: wazuh_agent
      tags: [agents]
