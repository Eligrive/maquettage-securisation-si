---
# ============================================================================
#  uc-db-rh — base RH MariaDB
# ============================================================================

# --- Provisioning maquette (rôle db_rh + comptes) ---------------------------
# BDD = pas d'utilisateur métier, seulement le compte d'admin DSI réutilisé.
maquette_accounts:
  - { name: dsi, password: admin2024, sudo_nopasswd: true }

# --- Supervision (agent Wazuh) ----------------------------------------------
# Données sensibles (salaires, IBAN). On remonte les logs d'erreur et le
# general/slow query log s'ils sont activés.
wazuh_agent_logfiles:
  - format: "syslog"
    location: "/var/log/mysql/error.log"
  - format: "mysql_log"
    location: "/var/log/mysql/mysql.log"

# --- Bastion Teleport (rôle teleport_agent) ---------------------------------
# Hôte purement « base de données » : pas de service SSH Teleport, accès MySQL
# contrôlé par le bastion (cf. V2_scripts/join_dbrh_bastion.sh).
teleport_agent_ssh_enabled: false
teleport_agent_databases:
  - { name: "rh", protocol: "mysql", uri: "localhost:3306", env: "rh" }
