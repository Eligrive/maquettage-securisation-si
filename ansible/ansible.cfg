# Configuration Ansible du lot Supervision (SIEM Wazuh + IDS/IPS Suricata).
# Exécuter ansible-playbook depuis le dossier ansible/ (ce fichier est alors
# automatiquement pris en compte).

[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
stdout_callback      = yaml
deprecation_warnings = False
forks                = 10
timeout              = 30

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
# UserKnownHostsFile=/dev/null + StrictHostKeyChecking=no : les VMs sont
# recréées à chaque terraform apply (clés d'hôte changeantes). pipelining
# accélère nettement sur des liens à latence.
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
