# ============================================================================
#  Inventaire Ansible — topologie V2 SEGMENTÉE (cf. docs/V2/network.md)
# ============================================================================
#
#  ansible_host = adresse joignable par le control node (CI ou poste admin).
#    - Le SIEM est atteint via sa Floating IP. Le placeholder __SIEM_FIP__ est
#      remplacé par scripts/gen-inventory.sh (depuis `terraform output`) ou à
#      la main pour une exécution locale.
#    - Les autres VMs n'ont PAS de Floating IP : elles sont atteintes par
#      rebond SSH (ProxyJump) via le bastion. Voir group_vars/agents.yml
#      (variable ssh_jump_host).
#
#  Pour une exécution sur la topologie « flat » (develop, avant segmentation),
#  utiliser inventory/hosts.flat.ini à la place.

[siem]
uc-srv-siem ansible_host=__SIEM_FIP__ siem_internal_ip=192.168.109.1

# Le firewall central est à la fois sonde IDS/IPS (Suricata) et agent Wazuh.
[firewall]
uc-srv-firewall ansible_host=192.168.108.1

# --- Services critiques : agent Wazuh + collecte applicative dédiée ----------
[agents_critical]
uc-srv-ldap       ansible_host=192.168.104.1
uc-web-rh         ansible_host=192.168.104.2
uc-db-rh          ansible_host=192.168.104.3
uc-srv-moodle     ansible_host=192.168.107.1
uc-srv-mail       ansible_host=192.168.105.1
uc-calc-recherche ansible_host=192.168.102.1
uc-srv-sso        ansible_host=192.168.107.3
uc-srv-bastion    ansible_host=192.168.103.2
uc-vpn-legacy     ansible_host=192.168.106.1

# --- Postes & services non critiques : agent Wazuh (HIDS de base) ------------
[agents_noncritical]
uc-poste-dsi     ansible_host=192.168.103.1
uc-poste-prof    ansible_host=192.168.101.2
uc-poste-etu     ansible_host=192.168.101.1
uc-srv-roundcube ansible_host=192.168.107.2

# --- Regroupements ------------------------------------------------------------
[agents:children]
agents_critical
agents_noncritical
firewall

[wazuh:children]
siem
agents
