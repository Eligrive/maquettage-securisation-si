# ============================================================================
#  Inventaire Ansible — topologie V2 SEGMENTÉE (cf. docs/V2/network.md)
# ============================================================================
#
#  ansible_host = adresse joignable par le control node (CI ou poste admin).
#    - Le SIEM est atteint via sa Floating IP. Le placeholder __SIEM_FIP__ est
#      remplacé par scripts/gen-inventory.sh (depuis `terraform output`) ou à
#      la main pour une exécution locale.
#    - Les autres VMs n'ont PAS de Floating IP : elles sont atteintes par
#      rebond SSH (ProxyJump) via le bastion. Voir group_vars/agents.yml
#      (variable ssh_jump_host).
#
#  Pour une exécution sur la topologie « flat » (develop, avant segmentation),
#  utiliser inventory/hosts.flat.ini à la place.

[siem]
uc-srv-siem ansible_host=__SIEM_FIP__ siem_internal_ip=192.168.109.1

# Le firewall central est à la fois sonde IDS/IPS (Suricata) et agent Wazuh.
[firewall]
uc-srv-firewall ansible_host=192.168.108.1

# --- Services critiques : agent Wazuh + collecte applicative dédiée ----------
[agents_critical]
uc-srv-ldap       ansible_host=192.168.104.1
uc-web-rh         ansible_host=192.168.104.2
uc-db-rh          ansible_host=192.168.104.3
uc-srv-moodle     ansible_host=192.168.107.1
uc-srv-mail       ansible_host=192.168.105.1
uc-calc-recherche ansible_host=192.168.102.1
uc-srv-sso        ansible_host=192.168.107.3
uc-srv-bastion    ansible_host=192.168.103.2
uc-vpn-legacy     ansible_host=192.168.106.1

# --- Serveurs non critiques : agent Wazuh (HIDS de base) --------------------
[agents_noncritical]
uc-srv-roundcube ansible_host=192.168.107.2

# --- Postes BYOD : appareils PERSONNELS, non administrés ---------------------
# PAS d'agent Wazuh (pas de droits admin, ni de pérennité : un BYOD se réinstalle
# / change). Ils sont supervisés AU NIVEAU RÉSEAU par la sonde Suricata du
# firewall, via les SERVICES qu'ils consomment (Moodle/mail/SSO/VPN, déjà sous
# agent) et via le BASTION pour toute action d'admin. Ce groupe n'est PAS enfant
# de [agents] : aucun rôle ne s'exécute dessus. Il est listé pour référence /
# évolution (ex. futur rôle NAC). IP indicatives (DHCP/NAC en pratique).
[postes_byod]
uc-poste-etu  ansible_host=192.168.101.1
uc-poste-prof ansible_host=192.168.101.2
uc-poste-dsi  ansible_host=192.168.103.1

# --- Regroupements ------------------------------------------------------------
[agents:children]
agents_critical
agents_noncritical
firewall

[wazuh:children]
siem
agents

# ============================================================================
#  Base maquette v1 — groupes par service (provisioning applicatif, provision.yml)
# ============================================================================
#  Les hôtes (et leur ansible_host) sont déclarés ci-dessus.
#
#  Topologie SEGMENTÉE (cible V2) : le pare-feu central uc-srv-firewall (groupe
#  [firewall] ci-dessus) porte la politique inter-VLAN -> il est provisionné par
#  le rôle fw_central (cf. provision.yml). Le rôle v1 fw_legacy (périmétrique
#  flat) n'est utilisé qu'avec inventory/hosts.flat.ini.

[srv_ldap]
uc-srv-ldap

[srv_mail]
uc-srv-mail

[srv_moodle]
uc-srv-moodle

[web_rh]
uc-web-rh

[db_rh]
uc-db-rh

[calc_recherche]
uc-calc-recherche

[vpn]
uc-vpn-legacy

# ============================================================================
#  Lot V2 IAM/PKI — SSO Keycloak, webmail Roundcube, bastion Teleport
# ============================================================================
#  Les hôtes (et leur ansible_host) sont déclarés plus haut dans [agents_*].

# SSO Keycloak (Docker) en DMZ — fédération LDAP read-only + clients OIDC.
[srv_sso]
uc-srv-sso

# Webmail Roundcube en DMZ — front IMAP/SMTP de uc-srv-mail, auth OIDC.
[srv_roundcube]
uc-srv-roundcube

# Bastion Teleport (VLAN admin) — auth + proxy, connecteur OIDC Keycloak.
[srv_bastion]
uc-srv-bastion

# Agents Teleport « node » (accès SSH contrôlé par le bastion).
[teleport_nodes]
uc-srv-ldap
uc-web-rh
uc-srv-moodle
uc-srv-roundcube
uc-srv-mail

# Agents Teleport « database » (accès DB MySQL/PostgreSQL contrôlé par le bastion).
[teleport_db]
uc-db-rh
uc-calc-recherche

# Tous les hôtes raccordés au bastion (rôle teleport_agent).
[teleport_agents:children]
teleport_nodes
teleport_db

# Postes clients : en segmenté ils ont des IP fixes (cf. [postes_byod] ci-dessus).
# Provisionnés par le rôle poste ; ce ne sont PAS des agents Wazuh.
[postes]
uc-poste-etu
uc-poste-prof
uc-poste-dsi

# Périmètre complet de la maquette (cible de provision.yml).
[maquette:children]
firewall
srv_ldap
srv_mail
srv_moodle
web_rh
db_rh
calc_recherche
vpn
srv_sso
srv_roundcube
srv_bastion
postes
