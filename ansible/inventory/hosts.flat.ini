# ============================================================================
#  Inventaire Ansible — topologie « FLAT » (develop actuel, avant segmentation)
# ============================================================================
#
#  Toutes les VMs sont sur le réseau campus 192.168.107.0/24. On les atteint
#  par rebond SSH via la Floating IP de fw-legacy (10.0.0.2 -> port DMZ).
#  Renseigner ssh_jump_host dans group_vars (ou -e) avec la FIP de fw-legacy.
#
#  Le SIEM doit être déployé avec siem_attach_campus=true (cf. terraform/siem.tf)
#  pour que les agents du réseau plat joignent le manager sur 192.168.107.30.

[siem]
uc-srv-siem ansible_host=__SIEM_FIP__ siem_internal_ip=192.168.107.30

[firewall]
uc-fw-legacy ansible_host=192.168.107.2

[agents_critical]
uc-srv-ldap       ansible_host=192.168.107.11
uc-web-rh         ansible_host=192.168.107.14
uc-db-rh          ansible_host=192.168.107.20
uc-srv-moodle     ansible_host=192.168.107.12
uc-srv-mail       ansible_host=192.168.107.10
uc-calc-recherche ansible_host=192.168.107.15
uc-vpn-legacy     ansible_host=192.168.107.3

[agents_noncritical]
# (roundcube/sso/bastion sont des ajouts V2, absents de la topologie flat develop)

# Postes BYOD : appareils personnels NON administrés -> PAS d'agent (cf. hosts.ini).
# Supervisés au niveau réseau (Suricata) et via les services. Listés pour mémoire ;
# en DHCP, IP variable.
[postes_byod]
# uc-poste-dsi  ansible_host=192.168.107.1xx
# uc-poste-prof ansible_host=192.168.107.1xx
# uc-poste-etu  ansible_host=192.168.107.1xx

[agents:children]
agents_critical
agents_noncritical
firewall

[wazuh:children]
siem
agents

# ============================================================================
#  Base maquette v1 — groupes par service (provisioning applicatif, provision.yml)
# ============================================================================
#  Les hôtes (et leur ansible_host) sont déclarés ci-dessus ; on ne fait que les
#  regrouper sémantiquement pour les rôles de provision.yml. Groupe dédié
#  [fw_legacy] (≠ [firewall]) : le rôle v1 fw_legacy ne s'applique qu'ici.

[fw_legacy]
uc-fw-legacy

[srv_ldap]
uc-srv-ldap

[srv_mail]
uc-srv-mail

[srv_moodle]
uc-srv-moodle

[web_rh]
uc-web-rh

[db_rh]
uc-db-rh

[calc_recherche]
uc-calc-recherche

[vpn]
uc-vpn-legacy

# Postes clients : DHCP (IP variable) -> renseigner ansible_host quand connu.
# Provisionnés en best-effort (rôle poste). Ce ne sont PAS des agents Wazuh
# (cf. [postes_byod] : non supervisés au niveau hôte).
[postes]
# uc-poste-etu  ansible_host=192.168.107.1xx
# uc-poste-prof ansible_host=192.168.107.1xx
# uc-poste-dsi  ansible_host=192.168.107.1xx

# Périmètre complet de la maquette v1 (cible de provision.yml).
[maquette:children]
fw_legacy
srv_ldap
srv_mail
srv_moodle
web_rh
db_rh
calc_recherche
vpn
postes

# En mode flat le manager écoute sur l'IP campus du SIEM.
[all:vars]
wazuh_manager_address=192.168.107.30
