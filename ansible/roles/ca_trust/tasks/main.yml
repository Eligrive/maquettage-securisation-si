---
# ============================================================================
#  Rôle ca_trust — distribution de l'ancre de confiance PKI interne
# ============================================================================
#  Installe le certificat racine UniCampus dans le magasin système des hôtes
#  pour que les connexions TLS internes (HTTPS reverse proxy, LDAPS, SMTPS,
#  back-channel OIDC vers sso.unicampus.fr) soient validées SANS avertissement.
#  cf. docs/V2/PKI.md §6 (« Distribution de la Confiance sur les Postes »).
#
#  Dépend du rôle pki (le rootCA.crt doit exister sous {{ pki_dir }} sur le
#  contrôleur). Idempotent : update-ca-certificates seulement si le fichier change.
#
#  REMÉDIATION (logs : « x509: certificate signed by unknown authority » côté
#  Teleport, « HTTP 500 » côté Web RH) : déposer l'ancre NE SUFFIT PAS. Les
#  services qui ont déjà chargé l'ancien magasin (Teleport, Apache/mod_php qui
#  porte le cURL OIDC) gardent l'ancien bundle EN MÉMOIRE jusqu'à redémarrage.
#  On les recharge donc de façon CONDITIONNELLE (seulement s'ils existent ET
#  seulement si le CA a changé), via service_facts + handler.

# Inventaire des services actifs : sert à ne redémarrer QUE ce qui est présent
# (cet hôte peut n'avoir ni Teleport, ni Apache : ex. le firewall en nginx).
- name: Collecter l'état des services (pour un redémarrage conditionnel)
  ansible.builtin.service_facts:

# Cibles = (services déclarés ∩ services présents) + unités php*-fpm détectées
# dynamiquement (nom versionné). Calculé même si le CA ne change pas (le handler,
# lui, n'est notifié que sur changement) -> coût négligeable, code lisible.
- name: Déterminer les services à recharger après rotation du CA
  ansible.builtin.set_fact:
    ca_trust_reload_targets: >-
      {{ ( (ca_trust_reload_services | intersect(_svc_keys))
           + (_svc_keys | select('match', '^php.*-fpm\.service$') | list) )
         | unique | list }}
  vars:
    _svc_keys: "{{ (ansible_facts.services | default({})).keys() | list }}"

- name: Déposer le certificat racine UniCampus dans le magasin local
  ansible.builtin.copy:
    src: "{{ pki_dir }}/rootCA.crt"
    dest: /usr/local/share/ca-certificates/unicampus-root.crt
    owner: root
    group: root
    mode: "0644"
  register: _ca_copy

- name: Mettre à jour le magasin de certificats système
  ansible.builtin.command: update-ca-certificates
  when: _ca_copy is changed
  changed_when: _ca_copy is changed
  # Recharge Teleport / Apache(mod_php) / php-fpm SEULEMENT si le bundle a changé.
  notify: reload services post ca-trust
