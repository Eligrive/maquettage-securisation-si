---
# ============================================================================
#  Rôle srv_roundcube — Apache/PHP + Roundcube + plugin OIDC Keycloak
# ============================================================================

- name: Pré-seed debconf Roundcube (base SQLite locale, auto-config)
  ansible.builtin.debconf:
    name: roundcube-core
    question: "{{ item.q }}"
    vtype: "{{ item.t }}"
    value: "{{ item.v }}"
  loop:
    - { q: "roundcube/dbconfig-install", t: "boolean", v: "true" }
    - { q: "roundcube/database-type", t: "select", v: "sqlite3" }
  loop_control:
    label: "{{ item.q }}"

- name: Installer Apache, PHP, Roundcube, git et composer
  ansible.builtin.apt:
    name:
      - apache2
      - libapache2-mod-php
      - php
      - php-imap
      - php-mbstring
      - php-xml
      - php-intl
      - php-zip
      - php-gd
      - php-curl
      - php-json
      - roundcube
      - roundcube-core
      - roundcube-plugins
      - git
      - composer
    state: present
    update_cache: true
  retries: 3
  delay: 10
  register: _apt_roundcube
  until: _apt_roundcube is succeeded

# --- Plugin OIDC (pulsejet/roundcube-oidc) -----------------------------------
- name: Cloner le plugin roundcube_oidc
  ansible.builtin.git:
    repo: "{{ roundcube_oidc_plugin_repo }}"
    dest: "{{ roundcube_webroot }}/plugins/roundcube_oidc"
    depth: 1
    version: HEAD
    update: false

- name: Installer les dépendances PHP du plugin via composer
  ansible.builtin.command: composer install --no-dev
  args:
    chdir: "{{ roundcube_webroot }}/plugins/roundcube_oidc"
    creates: "{{ roundcube_webroot }}/plugins/roundcube_oidc/vendor/autoload.php"

- name: Droits du plugin roundcube_oidc (www-data)
  ansible.builtin.file:
    path: "{{ roundcube_webroot }}/plugins/roundcube_oidc"
    owner: www-data
    group: www-data
    recurse: true

# --- Configuration Roundcube : backend mail + SSO Keycloak -------------------
#  Bloc géré en fin de config (la dernière définition d'une clé PHP gagne) :
#  reprend install_oidc_roundcube.sh + le câblage IMAP/SMTP vers uc-srv-mail.
- name: Configurer Roundcube (backend mail + plugin OIDC)
  ansible.builtin.blockinfile:
    path: "{{ roundcube_config }}"
    marker: "// {mark} ANSIBLE MANAGED: Roundcube V2 (backend mail + SSO Keycloak)"
    block: |
      $config['imap_host'] = '{{ roundcube_imap_host }}:{{ roundcube_imap_port }}';
      $config['smtp_host'] = '{{ roundcube_smtp_host }}:{{ roundcube_smtp_port }}';
      $config['smtp_user'] = '%u';
      $config['smtp_pass'] = '%p';
      $config['product_name'] = 'UniCampus Webmail';
      
      // SSO Keycloak (OIDC) via le plugin pulsejet/roundcube-oidc
      $config['plugins'][] = 'roundcube_oidc';
      $config['oidc_url'] = '{{ keycloak_issuer_url }}';
      $config['oidc_client'] = '{{ roundcube_oidc_client_id }}';
      $config['oidc_secret'] = '{{ oidc_secrets.roundcube }}';
      $config['oidc_scope'] = 'openid email profile';
      $config['oidc_field_uid'] = 'email';
      
      // Master password pour l'authentification Dovecot en arrière-plan
      $config['oidc_imap_master_password'] = 'SuperMotDePasseMaster';
  notify: restart apache2

# --- Apache : Roundcube à la racine (https://mail.unicampus.fr/) -------------
- name: Vhost Apache — Roundcube à la racine
  ansible.builtin.copy:
    dest: /etc/apache2/sites-available/000-default.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      <VirtualHost *:80>
          ServerName mail.unicampus.fr
          DocumentRoot {{ roundcube_webroot }}
          <Directory {{ roundcube_webroot }}>
              Options -Indexes +FollowSymLinks
              AllowOverride All
              Require all granted
          </Directory>
          ErrorLog ${APACHE_LOG_DIR}/error.log
          CustomLog ${APACHE_LOG_DIR}/access.log combined
      </VirtualHost>
  notify: restart apache2

- name: Retirer la page Apache par défaut
  ansible.builtin.file:
    path: /var/www/html/index.html
    state: absent

- name: Activer et démarrer Apache
  ansible.builtin.systemd:
    name: apache2
    state: started
    enabled: true