---
# ============================================================================
#  Rôle wazuh_manager — Wazuh all-in-one (manager + indexer + dashboard)
# ============================================================================

# Installeur assisté officiel Wazuh (déploie l'AIO en une passe : indexer
# OpenSearch + manager + dashboard + certificats auto-signés).
wazuh_aio_installer_url: "https://packages.wazuh.com/{{ wazuh_version }}/wazuh-install.sh"

# Répertoire de travail de l'installeur (y dépose wazuh-install-files.tar).
wazuh_aio_workdir: "/root"

# -i / --ignore-check : bypass le contrôle matériel (l'AIO exige 4 Go RAM ;
# utile si le flavor est juste à la limite). La VM SIEM est dimensionnée pour,
# mais on garde le bypass pour ne pas bloquer un déploiement de démo.
wazuh_aio_ignore_hw_check: true

# Récupération des identifiants générés (admin dashboard, kibanaserver, etc.)
# sur le control node, pour pouvoir se connecter au dashboard.
wazuh_fetch_credentials: true
wazuh_credentials_local_dir: "{{ playbook_dir }}/.wazuh-credentials"

# Entrée syslog distante (port 514) pour les équipements qui NE peuvent PAS
# faire tourner d'agent (appliances, équipements réseau). Les hôtes Linux de
# la maquette utilisent l'agent ; le syslog reste le filet pour le reste.
wazuh_manager_enable_syslog_input: true
wazuh_manager_syslog_port: 514
wazuh_manager_syslog_protocol: "udp"
# Réseaux internes autorisés à pousser du syslog (toute la plage privée du SI).
wazuh_manager_syslog_allowed_ips:
  - "192.168.0.0/16"

# Délai max (s) accordé à l'installeur AIO (téléchargement + install OpenSearch).
# Sur m1.medium l'AIO frôle les 30 min (l'install du dashboard + l'init sécurité
# de l'indexer sont lents sur ce flavor) : 2700 s (45 min) laisse une marge pour
# ne pas timeouter alors que le dernier composant se termine.
wazuh_aio_install_timeout: 2700

# ============================================================================
#  V2 IAM — SSO Keycloak (OpenID Connect) du dashboard Wazuh
# ============================================================================
#  Le dashboard est proxifié en HTTPS de confiance par nginx (wazuh.unicampus.fr,
#  cf. iam_vhosts) et fédéré à Keycloak en OIDC. RESTRICTION D'ACCÈS : seul le
#  groupe Equipe_DSI (rôle realm Admin_DSI) est mappé sur un rôle OpenSearch
#  admin (unicampus_sso_admin). Tout autre utilisateur authentifié n'a AUCUN
#  rôle -> accès refusé. L'auth « basic » (admin local) reste activée en
#  parallèle comme filet de secours (multi-auth) : NE PAS la retirer tant que le
#  SSO n'est pas validé en live, sinon risque de lock-out du dashboard.
wazuh_sso_enabled: true

# Métadonnées OIDC (dérivées de l'issuer Keycloak — cf. group_vars/all.yml).
wazuh_sso_connect_url: "{{ keycloak_issuer_url }}/.well-known/openid-configuration"
wazuh_sso_client_id: "wazuh-client"
wazuh_sso_client_secret: "{{ oidc_secrets.wazuh }}"
wazuh_sso_base_redirect_url: "https://wazuh.unicampus.fr"
wazuh_sso_scope: "openid profile email"

# Mapping claims -> identité/rôles côté OpenSearch security.
wazuh_sso_subject_key: "preferred_username"   # identifiant affiché de l'utilisateur
wazuh_sso_roles_key: "roles"                   # claim multivalué (mapper client KC)
# SEUL ce rôle realm (= membres du groupe Equipe_DSI) obtient l'admin Wazuh.
wazuh_sso_admin_realm_role: "Admin_DSI"
# Rôle OpenSearch (non réservé) créé pour porter ces privilèges admin. On NE
# touche PAS au rôle réservé all_access (non modifiable via securityadmin).
wazuh_sso_opensearch_role: "unicampus_sso_admin"

# Ancre PKI pour valider le back-channel TLS vers Keycloak. Côté dashboard on
# réutilise l'ancre système posée par ca_trust ; côté indexer on en dépose une
# copie DANS le répertoire de conf security (les chemins relatifs/absolus hors
# de ce dossier sont parfois rejetés par le plugin -> path traversal).
wazuh_sso_dashboard_root_ca: "/usr/local/share/ca-certificates/unicampus-root.crt"
wazuh_sso_indexer_root_ca_src: "{{ pki_dir }}/rootCA.crt"

# Chemins Wazuh AIO (indexer security + dashboard).
wazuh_indexer_secconf_dir: "/etc/wazuh-indexer/opensearch-security"
wazuh_indexer_certs_dir: "/etc/wazuh-indexer/certs"
wazuh_indexer_securityadmin: "/usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh"
wazuh_indexer_jdk: "/usr/share/wazuh-indexer/jdk"
wazuh_dashboard_config: "/etc/wazuh-dashboard/opensearch_dashboards.yml"
