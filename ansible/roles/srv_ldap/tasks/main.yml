---
# ============================================================================
#  Rôle srv_ldap — slapd (suffixe dc=unicampus,dc=local, clair, bind anonyme)
# ============================================================================

- name: Pré-seed debconf pour une install slapd non interactive
  ansible.builtin.debconf:
    name: slapd
    question: "{{ item.q }}"
    vtype: "{{ item.t }}"
    value: "{{ item.v }}"
  loop:
    - { q: "slapd/domain", t: "string", v: "{{ ldap_domain }}" }
    - { q: "shared/organization", t: "string", v: "{{ ldap_org }}" }
    - { q: "slapd/password1", t: "password", v: "{{ ldap_admin_password }}" }
    - { q: "slapd/password2", t: "password", v: "{{ ldap_admin_password }}" }
    - { q: "slapd/internal/adminpw", t: "password", v: "{{ ldap_admin_password }}" }
    - { q: "slapd/internal/generated_adminpw", t: "password", v: "{{ ldap_admin_password }}" }
    - { q: "slapd/no_configuration", t: "boolean", v: "false" }
    - { q: "slapd/purge_database", t: "boolean", v: "true" }
    - { q: "slapd/move_old_database", t: "boolean", v: "true" }
  loop_control:
    label: "{{ item.q }}"
  no_log: true

- name: Installer slapd et ldap-utils
  ansible.builtin.apt:
    name:
      - slapd
      - ldap-utils
    state: present
    update_cache: true
  retries: 3
  delay: 10
  register: _apt_ldap
  until: _apt_ldap is succeeded

- name: slapd écoute en clair ET en LDAPS (ldap:/// ldaps:/// ldapi:///)
  ansible.builtin.lineinfile:
    path: /etc/default/slapd
    regexp: '^SLAPD_SERVICES='
    # V2 : on ajoute ldaps:/// (port 636, TLS PKI). ldap:/// reste actif pour
    # la fédération Keycloak existante et la rétro-compat maquette.
    line: 'SLAPD_SERVICES="ldap:/// ldaps:/// ldapi:///"'
  notify: restart slapd

- name: Appliquer la conf slapd avant les opérations LDAP
  ansible.builtin.meta: flush_handlers

# --- rootDN password : dpkg-reconfigure ignore parfois le preseed -> le mdp admin
#     reste l'aléatoire généré à l'install. On le force via ldapmodify EXTERNAL,
#     uniquement si le bind échoue (idempotence : slappasswd a un sel aléatoire). -
- name: Tester le bind admin
  ansible.builtin.command:
    cmd: "ldapwhoami -x -H ldapi:/// -D cn=admin,{{ ldap_base_dn }} -w {{ ldap_admin_password }}"
  register: _ldap_bind
  changed_when: false
  failed_when: false
  no_log: true

- name: Forcer le rootDN password (olcRootPW) si le bind échoue
  ansible.builtin.shell: |
    set -e
    HASH=$(slappasswd -s '{{ ldap_admin_password }}')
    ldapmodify -Y EXTERNAL -H ldapi:/// <<EOF
    dn: olcDatabase={1}mdb,cn=config
    changetype: modify
    replace: olcRootPW
    olcRootPW: $HASH
    EOF
  when: _ldap_bind.rc != 0
  no_log: true

# --- Peuplement : OUs + comptes (idempotent : add seulement si absent) --------
# Hash du mot de passe initial (SSHA salé) : on ne stocke plus aucun mot de passe
# en clair dans l'annuaire (§4.4). Réinitialisation forcée au 1er login via SSO.
- name: Calculer le hash du mot de passe initial (slappasswd)
  ansible.builtin.command:
    cmd: "slappasswd -s {{ ldap_initial_password }}"
  register: _ldap_pw
  changed_when: false
  no_log: true

- name: Exposer le hash pour le template LDIF
  ansible.builtin.set_fact:
    ldap_pw_hash: "{{ _ldap_pw.stdout }}"
  no_log: true

- name: Déposer le LDIF de peuplement
  ansible.builtin.template:
    src: uc-base.ldif.j2
    dest: /tmp/uc-base.ldif
    owner: root
    group: root
    mode: "0600"

# Bind AUTHENTIFIÉ (cn=admin) : le bind anonyme est désactivé plus bas, ce test
# doit donc rester valide même après durcissement.
- name: Vérifier si l'arbre est déjà peuplé (ou=people)
  ansible.builtin.command:
    cmd: "ldapsearch -x -H ldapi:/// -D cn=admin,{{ ldap_base_dn }} -w {{ ldap_admin_password }} -b ou=people,{{ ldap_base_dn }} -s base dn"
  register: _ldap_people
  changed_when: false
  failed_when: false
  no_log: true

- name: Peupler l'annuaire (OUs + comptes)
  ansible.builtin.command:
    cmd: "ldapadd -x -H ldapi:/// -D cn=admin,{{ ldap_base_dn }} -w {{ ldap_admin_password }} -f /tmp/uc-base.ldif"
  when: _ldap_people.rc != 0
  no_log: true

# ============================================================================
#  V2 — LDAPS (TLS sur port 636) via la PKI interne (cf. docs/V2/PKI.md §5.C)
# ============================================================================
#  Corrige le LDAP en clair (règle 31 ANSSI). Le certificat ldap.* est émis par
#  le rôle pki sur le contrôleur ; la clé est lisible par l'utilisateur openldap.
- name: LDAPS — déposer la chaîne de CA (intermédiaire + racine)
  ansible.builtin.copy:
    src: "{{ pki_dir }}/ca-chain.crt"
    dest: /etc/ssl/certs/unicampus-ca.crt
    owner: root
    group: root
    mode: "0644"
  notify: restart slapd

- name: LDAPS — déposer la fullchain serveur
  ansible.builtin.copy:
    src: "{{ pki_dir }}/ldap.fullchain.crt"
    dest: /etc/ssl/certs/ldap.fullchain.crt
    owner: root
    group: root
    mode: "0644"
  notify: restart slapd

# /etc/ssl/private est en 0700 root:root sur l'image (pas de paquet/groupe ssl-cert) :
# openldap ne peut pas y entrer. Contrairement à postfix/dovecot/nginx qui lisent
# leur clé en root, slapd tourne en openldap et charge la clé via ldapmodify -> il
# lui faut un répertoire traversable. On dédie /etc/ldap/tls (owner openldap).
- name: LDAPS — répertoire TLS dédié, lisible par openldap
  ansible.builtin.file:
    path: /etc/ldap/tls
    state: directory
    owner: openldap
    group: openldap
    mode: "0750"

- name: LDAPS — déposer la clé privée (lisible par openldap)
  ansible.builtin.copy:
    src: "{{ pki_dir }}/ldap.key"
    dest: /etc/ldap/tls/ldap.key
    owner: openldap
    group: openldap
    mode: "0600"
  notify: restart slapd

- name: LDAPS — vérifier si la conf TLS est déjà appliquée
  ansible.builtin.shell:
    cmd: "ldapsearch -Y EXTERNAL -H ldapi:/// -b cn=config -LLL olcTLSCertificateFile 2>/dev/null | grep -q ldap.fullchain.crt"
  register: _ldaps_set
  changed_when: false
  failed_when: false

- name: LDAPS — appliquer la configuration TLS (cn=config)
  ansible.builtin.shell: |
    ldapmodify -Y EXTERNAL -H ldapi:/// <<'EOF'
    dn: cn=config
    changetype: modify
    replace: olcTLSCACertificateFile
    olcTLSCACertificateFile: /etc/ssl/certs/unicampus-ca.crt
    -
    replace: olcTLSCertificateFile
    olcTLSCertificateFile: /etc/ssl/certs/ldap.fullchain.crt
    -
    replace: olcTLSCertificateKeyFile
    olcTLSCertificateKeyFile: /etc/ldap/tls/ldap.key
    EOF
  when: _ldaps_set.rc != 0
  notify: restart slapd

# ============================================================================
#  V2 — Durcissement des ACL : INTERDIRE le bind/lecture ANONYME (§3.1)
# ============================================================================
#  Neutralise la reconnaissance LDAP anonyme utilisée en amont de SO1 et SO3
#  (énumération des comptes / userPassword). Seuls cn=admin (rootDN, fédération
#  Keycloak) et les comptes authentifiés peuvent lire l'annuaire.
#   - userPassword : accessible seulement en self-write et anonymous=auth (le
#     compare nécessaire au bind), jamais en lecture.
#   - reste de l'arbre : lecture réservée aux comptes authentifiés (by users).
- name: Durcissement — vérifier si les ACL anti-anonyme sont déjà posées
  ansible.builtin.shell:
    cmd: "ldapsearch -Y EXTERNAL -H ldapi:/// -b olcDatabase={1}mdb,cn=config -LLL olcAccess 2>/dev/null | grep -q 'by anonymous auth'"
  register: _ldap_acl_set
  changed_when: false
  failed_when: false

- name: Durcissement — appliquer les ACL (bind/lecture anonyme interdits)
  ansible.builtin.shell: |
    ldapmodify -Y EXTERNAL -H ldapi:/// <<'EOF'
    dn: olcDatabase={1}mdb,cn=config
    changetype: modify
    replace: olcAccess
    olcAccess: {0}to attrs=userPassword by self write by anonymous auth by * none
    olcAccess: {1}to * by self read by users read by * none
    EOF
  when: _ldap_acl_set.rc != 0
  notify: restart slapd
