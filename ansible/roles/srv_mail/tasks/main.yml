---
# ============================================================================
#  Rôle srv_mail — Postfix + Dovecot (clair, relais ouvert) + leurre mail DSI
# ============================================================================

- name: Pré-seed debconf pour Postfix
  ansible.builtin.debconf:
    name: postfix
    question: "{{ item.q }}"
    vtype: "{{ item.t }}"
    value: "{{ item.v }}"
  loop:
    - { q: "postfix/mailname", t: "string", v: "{{ mail_domain }}" }
    - { q: "postfix/main_mailer_type", t: "select", v: "Internet Site" }
  loop_control:
    label: "{{ item.q }}"

- name: Installer Postfix, Dovecot (IMAP/POP3) et mailutils
  ansible.builtin.apt:
    name:
      - postfix
      - dovecot-imapd
      - dovecot-pop3d
      - mailutils
    state: present
    update_cache: true
  retries: 3
  delay: 10
  register: _apt_mail
  until: _apt_mail is succeeded

# --- V2 : certificat PKI interne (STARTTLS Postfix/Dovecot, cf. PKI.md §5.B) --
- name: TLS — déposer la fullchain de messagerie
  ansible.builtin.copy:
    src: "{{ pki_dir }}/mail.fullchain.crt"
    dest: /etc/ssl/certs/mail.fullchain.crt
    owner: root
    group: root
    mode: "0644"
  notify:
    - restart postfix
    - restart dovecot

- name: TLS — déposer la clé privée de messagerie
  ansible.builtin.copy:
    src: "{{ pki_dir }}/mail.key"
    dest: /etc/ssl/private/mail.key
    owner: root
    group: dovecot
    mode: "0640"
  notify:
    - restart postfix
    - restart dovecot

# --- Postfix : écoute partout, relais ouvert, aucun TLS, Maildir -------------
# Bloc d'overrides en fin de main.cf (la dernière définition d'une clé gagne).
- name: Surcharger la configuration Postfix (relais ouvert + STARTTLS V2)
  ansible.builtin.blockinfile:
    path: /etc/postfix/main.cf
    marker: "# {mark} ANSIBLE MANAGED: maquette vulnérable (srv_mail)"
    block: |
      inet_interfaces = all
      inet_protocols = ipv4
      mydestination = {{ mail_domain }}, localhost.localdomain, localhost
      mynetworks = 0.0.0.0/0
      home_mailbox = Maildir/
      # V2 : STARTTLS opportuniste (PKI interne). « may » conserve le clair pour
      # la rétro-compat maquette, tout en proposant le chiffrement (règle 31 ANSSI).
      smtpd_tls_security_level = may
      smtpd_tls_cert_file = /etc/ssl/certs/mail.fullchain.crt
      smtpd_tls_key_file = /etc/ssl/private/mail.key
  notify: restart postfix

# --- Dovecot : plaintext autorisé, pas de TLS, Maildir ----------------------
- name: Dovecot — autoriser l'auth plaintext
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-auth.conf
    regexp: '^#?\s*disable_plaintext_auth\s*='
    line: "disable_plaintext_auth = no"
  notify: restart dovecot

- name: Dovecot — mécanismes d'auth plain login
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-auth.conf
    regexp: '^#?\s*auth_mechanisms\s*='
    line: "auth_mechanisms = plain login"
  notify: restart dovecot

- name: Dovecot — Maildir
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-mail.conf
    regexp: '^#?\s*mail_location\s*='
    line: "mail_location = maildir:~/Maildir"
  notify: restart dovecot

- name: Dovecot — activer TLS (STARTTLS, PKI interne)
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-ssl.conf
    regexp: '^#?\s*ssl\s*='
    # « yes » (et non « required ») : le chiffrement est disponible sans casser
    # l'auth plaintext historique de la maquette (vuln V1 conservée pour la démo).
    line: "ssl = yes"
  notify: restart dovecot

- name: Dovecot — certificat TLS (PKI interne)
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-ssl.conf
    regexp: '^#?\s*ssl_cert\s*='
    line: "ssl_cert = </etc/ssl/certs/mail.fullchain.crt"
  notify: restart dovecot

- name: Dovecot — clé privée TLS (PKI interne)
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-ssl.conf
    regexp: '^#?\s*ssl_key\s*='
    line: "ssl_key = </etc/ssl/private/mail.key"
  notify: restart dovecot

# --- Leurre : mail informel DSI partagé en clair (compte admin réutilisé) ----
# Modélise une dérive : la DSI distribue par mail un compte d'admin "de secours".
- name: Créer la Maildir du compte leurre
  ansible.builtin.file:
    path: "/home/{{ mail_decoy_user }}/Maildir/cur"
    state: directory
    owner: "{{ mail_decoy_user }}"
    group: "{{ mail_decoy_user }}"
    mode: "0700"

- name: Déposer le mail-leurre (compte d'urgence DSI en clair)
  ansible.builtin.template:
    src: dsi-mail.j2
    # Nom de fichier Maildir (suffixe :2,S) — généré sur la cible Linux.
    dest: "/home/{{ mail_decoy_user }}/Maildir/cur/1700000000.uc.mail:2,S"
    owner: "{{ mail_decoy_user }}"
    group: "{{ mail_decoy_user }}"
    mode: "0644"

- name: Activer et démarrer Postfix et Dovecot
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - postfix
    - dovecot
