---
- name: restart postfix
  ansible.builtin.systemd:
    name: postfix
    state: restarted
    enabled: true

- name: restart dovecot
  ansible.builtin.systemd:
    name: dovecot
    state: restarted
    enabled: true

- name: restart opendkim
  ansible.builtin.systemd:
    name: opendkim
    state: restarted
    enabled: true
