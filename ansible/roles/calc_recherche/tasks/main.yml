---
# ============================================================================
#  Rôle calc_recherche — NFS + Samba + PostgreSQL + Jupyter (sans auth)
# ============================================================================

- name: Installer NFS, Samba, PostgreSQL et Python
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - samba
      - postgresql
      - python3-pip
      - python3-venv
    state: present
    update_cache: true
  retries: 3
  delay: 10
  register: _apt_calc
  until: _apt_calc is succeeded

# --- Groupe propriétaire du partage (moindre privilège, §3.3/§3.4) -----------
- name: Créer le groupe propriétaire du partage recherche
  ansible.builtin.group:
    name: "{{ calc_share_group }}"
    state: present

- name: Rattacher les utilisateurs autorisés au groupe du partage
  ansible.builtin.user:
    name: "{{ item.user }}"
    groups: "{{ calc_share_group }}"
    append: true
  loop: "{{ calc_smb_users }}"
  loop_control:
    label: "{{ item.user }}"

- name: Créer le partage de données recherche (2770, plus de 0777)
  ansible.builtin.file:
    path: "{{ calc_share_path }}"
    state: directory
    # owner fixé à 'root' ici (l'utilisateur de service {{ calc_pg_user }} est
    # créé plus bas) ; le chown final vers {{ calc_pg_user }}:{{ calc_share_group }}
    # est appliqué après création du compte de service.
    owner: root
    group: "{{ calc_share_group }}"
    # setgid (2) : les fichiers créés héritent du groupe -> accès restreint aux
    # seuls membres autorisés (remédiation §3.4, remplace 0777).
    mode: "2770"

# --- NFS : export restreint au VLAN recherche + root_squash (§3.3) -----------
- name: Exporter {{ calc_share_path }} en NFS (clients restreints, root_squash)
  ansible.builtin.lineinfile:
    path: /etc/exports
    regexp: "^{{ calc_share_path | regex_escape }}\\s"
    line: "{{ calc_share_path }} {{ calc_nfs_clients }}(rw,sync,root_squash,no_subtree_check)"
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: reexport nfs

- name: Activer et démarrer le serveur NFS
  ansible.builtin.systemd:
    name: nfs-kernel-server
    state: started
    enabled: true

# --- Samba : durcissement global (plus d'accès invité/anonyme, §3.4) ---------
- name: Durcir la configuration Samba globale (anti-invité/anonyme)
  ansible.builtin.blockinfile:
    path: /etc/samba/smb.conf
    marker: "# {mark} ANSIBLE MANAGED: durcissement global (calc_recherche)"
    insertafter: '^\[global\]'
    block: |
      # §3.4 : aucun accès invité/anonyme, protocole moderne uniquement.
      map to guest = Never
      restrict anonymous = 2
      server min protocol = SMB2
  notify: restart smbd

# --- Samba : un SEUL partage, AUTHENTIFIÉ, sans force user=root (§3.4) --------
- name: Configurer le partage Samba partenaires (authentifié, sans force root)
  ansible.builtin.blockinfile:
    path: /etc/samba/smb.conf
    marker: "# {mark} ANSIBLE MANAGED: partages maquette (calc_recherche)"
    block: |
      [partenaires]
         path = {{ calc_share_path }}
         browseable = yes
         read only = no
         guest ok = no
         valid users = {{ calc_samba_valid_users }}
         # plus de "force user = root" : chaque accès s'exécute avec l'identité
         # du compte authentifié (moindre privilège).
         force group = {{ calc_share_group }}
         create mask = 0660
         directory mask = 2770
  notify: restart smbd

- name: Activer et démarrer Samba
  ansible.builtin.systemd:
    name: smbd
    state: started
    enabled: true

- name: Lister les comptes Samba existants
  ansible.builtin.command:
    cmd: pdbedit -L
  register: _pdbedit
  changed_when: false
  failed_when: false

- name: Définir les mots de passe Samba (comptes manquants)
  ansible.builtin.shell: >-
    printf '%s\n%s\n' '{{ item.password }}' '{{ item.password }}' | smbpasswd -a -s {{ item.user }}
  loop: "{{ calc_smb_users }}"
  loop_control:
    label: "{{ item.user }}"
  when: (item.user ~ ':') not in (_pdbedit.stdout | default(''))
  no_log: true

# --- PostgreSQL local : base résultats expérimentaux (idempotent) -----------
- name: Vérifier le rôle PostgreSQL {{ calc_pg_user }}
  ansible.builtin.command:
    cmd: "sudo -u postgres psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname='{{ calc_pg_user }}'\""
  register: _pg_role
  changed_when: false

- name: Créer le rôle PostgreSQL
  ansible.builtin.command:
    cmd: "sudo -u postgres psql -c \"CREATE USER {{ calc_pg_user }} WITH PASSWORD '{{ calc_pg_pass }}'\""
  when: (_pg_role.stdout | trim) != '1'
  no_log: true

- name: Vérifier la base PostgreSQL {{ calc_pg_db }}
  ansible.builtin.command:
    cmd: "sudo -u postgres psql -tAc \"SELECT 1 FROM pg_database WHERE datname='{{ calc_pg_db }}'\""
  register: _pg_db
  changed_when: false

- name: Créer la base PostgreSQL
  ansible.builtin.command:
    cmd: "sudo -u postgres psql -c \"CREATE DATABASE {{ calc_pg_db }}\""
  when: (_pg_db.stdout | trim) != '1'

- name: Octroyer les privilèges sur la base
  ansible.builtin.command:
    cmd: "sudo -u postgres psql -c \"GRANT ALL PRIVILEGES ON DATABASE {{ calc_pg_db }} TO {{ calc_pg_user }}\""
  changed_when: false

# --- Jupyter sans token ni mot de passe (0.0.0.0:8888) ----------------------
# venv isolé : sur Ubuntu 24.04 le paquet apt python3-traitlets casse pip
# (RECORD manquant) -> import error -> service en crash loop. Le venv isole.
- name: Créer le compte de service Jupyter
  ansible.builtin.user:
    name: "{{ calc_pg_user }}"
    shell: /bin/bash
    create_home: true

- name: Créer le venv Jupyter
  ansible.builtin.command:
    cmd: python3 -m venv /opt/jupyter-venv
    creates: /opt/jupyter-venv/bin/activate

- name: Mettre à jour pip dans le venv
  ansible.builtin.command:
    cmd: /opt/jupyter-venv/bin/pip install --quiet --upgrade pip
    creates: /opt/jupyter-venv/bin/jupyter-notebook
  changed_when: false

- name: Installer notebook dans le venv
  ansible.builtin.command:
    cmd: /opt/jupyter-venv/bin/pip install --quiet notebook
    creates: /opt/jupyter-venv/bin/jupyter-notebook

- name: Donner le partage au compte de service + groupe restreint
  ansible.builtin.file:
    path: "{{ calc_share_path }}"
    owner: "{{ calc_pg_user }}"
    group: "{{ calc_share_group }}"
    recurse: true

- name: Déployer l'unité systemd Jupyter
  ansible.builtin.template:
    src: jupyter.service.j2
    dest: /etc/systemd/system/jupyter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart jupyter

- name: Activer et démarrer Jupyter
  ansible.builtin.systemd:
    name: jupyter
    state: started
    enabled: true
    daemon_reload: true
