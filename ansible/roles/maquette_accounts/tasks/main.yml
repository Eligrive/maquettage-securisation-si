---
# ============================================================================
#  Rôle maquette_accounts — comptes Unix nominatifs + sudoers NOPASSWD
# ============================================================================

- name: Créer les comptes Unix nominatifs (mots de passe réutilisés)
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: true
    # Sel déterministe (= nom) -> hash stable -> tâche idempotente.
    password: "{{ item.password | password_hash('sha512', item.name) if item.password is defined else omit }}"
    update_password: always
  loop: "{{ maquette_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.create_user | default(true)
  no_log: true

- name: Octroyer sudo NOPASSWD (drop-in sudoers validé)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/91-uc-{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ maquette_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.sudo_nopasswd | default(false)

# V2 (remédiation §2.5) : sudo NOMINATIF avec MOT DE PASSE exigé (plus de
# NOPASSWD pour les administrateurs humains). L'accès admin distant passe par le
# bastion (Teleport) ; le sudo local requiert l'authentification de l'opérateur.
- name: Octroyer sudo avec mot de passe (drop-in sudoers validé)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/92-uc-{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ maquette_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.sudo | default(false)

# Nettoyage : supprimer les comptes obsolètes (ex. l'ancien compte partagé 'dsi'
# distribué en clair par mail — remédiation §2.5/§4.5) et leurs drop-in sudoers.
- name: Supprimer les comptes obsolètes (compte partagé V1)
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ maquette_accounts_absent }}"
  loop_control:
    label: "{{ item }}"

- name: Retirer les drop-in sudoers des comptes obsolètes
  ansible.builtin.file:
    path: "/etc/sudoers.d/91-uc-{{ item }}"
    state: absent
  loop: "{{ maquette_accounts_absent }}"
  loop_control:
    label: "{{ item }}"
