---
# ============================================================================
#  Rôle srv_moodle — LMS Moodle (ex scripts/srv-moodle.sh)
# ============================================================================
# Apache + PHP + MariaDB locale, HTTP en clair, aucune politique de mot de passe
# (vulns volontaires §4.2/§6.2).

moodle_branch: "MOODLE_404_STABLE"
moodle_db_name: "moodle"
moodle_db_user: "moodle"
moodle_db_pass: "unicampus2024"
moodle_admin_pass: "Admin2024" # volontairement faible

# Moodle redirige toutes les requêtes vers wwwroot : en V2 c'est l'URL PUBLIQUE
# HTTPS servie par le reverse proxy (terminaison TLS PKI + SSO). Le proxy relaie
# en HTTP vers Moodle -> $CFG->sslproxy doit être vrai (cf. tasks). Surchargeable
# en CI/local par -e moodle_wwwroot=... (ex. http://<FIP_moodle> pour la V1).
moodle_wwwroot: "https://moodle.unicampus.fr"

# --- SSO Keycloak (OIDC) — cf. V2_scripts/install_oidc_moodle.sh -------------
# Plugin officiel Microsoft auth_oidc. La bascule en masse des comptes existants
# vers OIDC (UPDATE mdl_user) est désactivée par défaut pour ne pas verrouiller
# le compte admin local de secours ; activer avec moodle_oidc_migrate_users=true.
moodle_oidc_plugin_repo: "https://github.com/microsoft/moodle-auth_oidc.git"
# La branche du plugin doit correspondre à la version de Moodle installée, sinon
# l'upgrade CLI échoue ("Dependencies check failed for auth_oidc"). Le plugin suit
# la même convention de nommage que Moodle (MOODLE_404_STABLE).
moodle_oidc_plugin_version: "{{ moodle_branch }}"
moodle_oidc_client_id: "moodle-client"
moodle_oidc_migrate_users: false
