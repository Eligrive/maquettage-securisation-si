---
# ============================================================================
#  Rôle web_rh — portail RH Apache/PHP (SQLi volontaire)
# ============================================================================

- name: Installer Apache + PHP (mysqli)
  ansible.builtin.apt:
    name:
      - apache2
      - php
      - php-mysqli
      - libapache2-mod-php
    state: present
    update_cache: true
  retries: 3
  delay: 10
  register: _apt_webrh
  until: _apt_webrh is succeeded

- name: Déposer le portail RH (index.php — SQLi par conception)
  ansible.builtin.template:
    src: index.php.j2
    dest: /var/www/html/index.php
    owner: www-data
    group: www-data
    mode: "0644"

- name: Retirer la page Apache par défaut
  ansible.builtin.file:
    path: /var/www/html/index.html
    state: absent

# ============================================================================
#  V2 — SSO Keycloak (OIDC) — cf. V2_scripts/setup_oidc_webrh.sh
# ============================================================================
#  Le portail RH est une appli PHP « maison » : l'intégration OIDC complète
#  nécessite une librairie (jumbojett/openid-connect-php) côté code. On dépose
#  ici la configuration OIDC (client/secret/issuer + rôle realm requis) ; elle
#  est exposée via le reverse proxy en HTTPS (rh/webrh.unicampus.fr).
- name: OIDC — déposer la configuration Keycloak du portail RH
  ansible.builtin.copy:
    dest: /etc/webrh-oidc.env
    owner: www-data
    group: www-data
    mode: "0640"
    content: |
      # {{ ansible_managed }}
      AUTH_METHOD=OIDC
      OIDC_PROVIDER_URL={{ keycloak_issuer_url }}
      OIDC_CLIENT_ID=webrh-client
      OIDC_CLIENT_SECRET={{ oidc_secrets.webrh }}
      OIDC_REDIRECT_URI=https://webrh.unicampus.fr/auth-callback
      OIDC_SCOPES=openid profile email
      # Rôle Keycloak requis pour ouvrir une session RH (filtrage applicatif).
      REQUIRED_REALM_ROLE=Admin_RH
  no_log: true

- name: Activer et démarrer Apache
  ansible.builtin.systemd:
    name: apache2
    state: started
    enabled: true
