---
# ============================================================================
#  Rôle loot — dépôt des documents-leurres (PDF)
# ============================================================================

- name: Lister les PDF sources (sur le control node)
  ansible.builtin.set_fact:
    loot_source_files: "{{ query('fileglob', loot_src_root ~ '/' ~ loot_assets_dir ~ '/*.pdf') }}"
  when: loot_assets_dir | length > 0

- name: Créer les répertoires de destination
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ loot_dests }}"
  loop_control:
    label: "{{ item.path }}"

- name: Déposer les PDF-leurres dans chaque destination
  ansible.builtin.copy:
    src: "{{ item.1 }}"
    dest: "{{ item.0.path }}/{{ item.1 | basename }}"
    owner: "{{ item.0.owner | default('root') }}"
    group: "{{ item.0.group | default('root') }}"
    mode: "0644"
  loop: "{{ loot_dests | product(loot_source_files | default([])) | list }}"
  loop_control:
    label: "{{ item.1 | basename }} -> {{ item.0.path }}"
