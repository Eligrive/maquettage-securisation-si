# Déposé par Ansible (rôle common) — V2 DURCIE (remédiation cred-reuse / §2.x).
# L'authentification SSH par MOT DE PASSE est DÉSACTIVÉE : elle était le vecteur
# de latéralisation par réutilisation de credentials (SO2/SO5/SO6 — "un mot de
# passe valable partout"). L'accès se fait par clé/certificat, et l'administration
# distante passe OBLIGATOIREMENT par le bastion (Teleport, certificats + SSO).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
