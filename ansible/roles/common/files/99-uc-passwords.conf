# Déposé par Ansible (rôle common) — maquette VOLONTAIREMENT vulnérable.
# Réactive l'auth SSH par mot de passe (désactivée par défaut sur l'image cloud
# Ubuntu via 60-cloudimg-settings.conf) pour démontrer la latéralisation par
# réutilisation de credentials (pas de SSO).
PasswordAuthentication yes
KbdInteractiveAuthentication yes
PermitRootLogin no
