---
# ============================================================================
#  Rôle common — bootstrap commun aux VMs de la maquette v1
# ============================================================================
#
# Remplace la partie "SSH password auth" de l'ancien terraform/scripts/_bootstrap.sh.
# L'attente de fw-legacy (forwarding Internet avant apt) est désormais assurée par
# l'ORDRE du playbook (le rôle fw_legacy est joué en premier, cf. provision.yml) et
# par les retries des tâches apt des rôles services.
#
# V2 DURCIE (remédiation cred-reuse) : l'authentification SSH par mot de passe est
# DÉSACTIVÉE. C'était le vecteur de latéralisation par réutilisation de credentials
# (SO2/SO5/SO6). L'accès se fait par clé/certificat ; l'administration distante
# passe par le bastion (Teleport). Ansible continue de fonctionner (clé SSH).

- name: Vérifier que l'OS est de la famille Debian/Ubuntu
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == "Debian"
    fail_msg: "Le rôle common cible Ubuntu/Debian."

# Prérequis du module ansible.builtin.debconf (utilisé par srv_ldap pour slapd
# et par fw_central pour iptables-persistent) : il invoque debconf-get-selections,
# fourni par debconf-utils, ABSENT de l'image cloud Ubuntu minimale.
- name: Installer debconf-utils (prérequis du module debconf)
  ansible.builtin.apt:
    name: debconf-utils
    state: present
    update_cache: true
  become: true
  retries: 3
  delay: 10
  register: _apt_debconf_utils
  until: _apt_debconf_utils is succeeded

- name: Désactiver l'authentification SSH par mot de passe (drop-in)
  ansible.builtin.copy:
    src: 99-uc-passwords.conf
    dest: /etc/ssh/sshd_config.d/99-uc-passwords.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart ssh

# Filet de sécurité si une distrib n'honore pas sshd_config.d.
- name: Forcer PasswordAuthentication=no dans le sshd_config principal
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PasswordAuthentication\s+.*$'
    replace: "PasswordAuthentication no"
  become: true
  notify: restart ssh

# Garde-fou « production » : on NE redémarre JAMAIS sshd sur une config invalide
# (sinon plus de SSH du tout, donc plus d'Ansible). `sshd -t` valide l'ensemble
# (sshd_config + drop-ins sshd_config.d) AVANT que le handler `restart ssh` ne
# tourne en fin de play. Chemin absolu : /usr/sbin n'est pas dans le PATH non
# interactif d'Ansible. NB : sous Ubuntu le service est `ssh` (le nommage
# RedHat `sshd` n'existe pas -> « Unit sshd.service could not be found »).
- name: Valider la configuration SSH avant tout redémarrage (sshd -t)
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  become: true
  changed_when: false
