---
# ============================================================================
#  Rôle backups — client restic (sauvegardes immuables) — §5.2 / M22
# ============================================================================

- name: Installer restic
  ansible.builtin.apt:
    name: restic
    state: present
    update_cache: true
  retries: 3
  delay: 10
  register: _apt_restic
  until: _apt_restic is succeeded

- name: Créer le répertoire de staging des dumps
  ansible.builtin.file:
    path: "{{ backup_staging_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Déposer l'environnement restic (URL dépôt + mot de passe)
  ansible.builtin.copy:
    dest: /etc/uc-backup.env
    owner: root
    group: root
    mode: "0600"
    content: |
      # {{ ansible_managed }}
      RESTIC_REPOSITORY={{ backup_repo_url }}
      RESTIC_PASSWORD={{ backup_password }}
  no_log: true

- name: Initialiser le dépôt restic (si nécessaire, idempotent)
  ansible.builtin.shell:
    cmd: 'set -a; . /etc/uc-backup.env; restic snapshots >/dev/null 2>&1 || restic init'
  register: _restic_init
  changed_when: "'created restic repository' in _restic_init.stdout"
  failed_when:
    - _restic_init.rc != 0
    - "'already initialized' not in (_restic_init.stderr | default(''))"

- name: Déposer le script de sauvegarde
  ansible.builtin.template:
    src: uc-backup.sh.j2
    dest: /usr/local/sbin/uc-backup
    owner: root
    group: root
    mode: "0750"

- name: Déposer l'unité systemd de sauvegarde
  ansible.builtin.template:
    src: uc-backup.service.j2
    dest: /etc/systemd/system/uc-backup.service
    owner: root
    group: root
    mode: "0644"

- name: Déposer le timer systemd de sauvegarde
  ansible.builtin.template:
    src: uc-backup.timer.j2
    dest: /etc/systemd/system/uc-backup.timer
    owner: root
    group: root
    mode: "0644"

- name: Activer le timer de sauvegarde
  ansible.builtin.systemd:
    name: uc-backup.timer
    state: started
    enabled: true
    daemon_reload: true
